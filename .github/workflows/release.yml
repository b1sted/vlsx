name: Release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: b1sted/ci/.github/workflows/c-release.yml@v1
    with:
      pkg_name: vlsx
      bin_path: bin/vlsx
      version_flag: "-v"
      homepage: https://github.com/b1sted/vlsx
      description: A lightweight terminal toolkit in C for network engineers to calculate VLSM, multicast MACs, SLA metrics, and DHCP timers.
      license: GPL-3.0-or-later
      maintainer: Nikita Mandrykin <pkg@basted.dev>
      gpg_fingerprint: "0DDA70A6A02167984707F0F7A8DE7BE6803A4BE2"
      homebrew_tap: b1sted/homebrew-tap
      packages_dispatch_repo: b1sted/packages.basted.dev
      lint_packages: clang-format-18 cppcheck
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      PACKAGES_DISPATCH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
