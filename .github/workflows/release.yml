name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test, leak & lint
    uses: ./.github/workflows/test.yml

  build-linux-amd64:
    name: Build (linux-amd64)
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build static binary
        run: make STATIC=1 VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test static binary
        run: ./bin/vlsx -v

      - name: Stage static binary
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx-static

      - name: Build dynamic binary
        run: make clean && make VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test dynamic binary
        run: ./bin/vlsx -v

      - name: Stage dynamic binary
        run: cp bin/vlsx artifact/vlsx-dynamic

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vlsx-linux-amd64
          path: artifact/
          if-no-files-found: error

  build-linux-cross:
    name: Build (linux-${{ matrix.name }})
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            cross: aarch64-linux-gnu
            qemu: qemu-aarch64
            pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - name: armv7
            cross: arm-linux-gnueabihf
            qemu: qemu-arm
            pkg: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          - name: riscv64
            cross: riscv64-linux-gnu
            qemu: qemu-riscv64
            pkg: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.pkg }} qemu-user

      - name: Build static binary
        run: >-
          make CC=${{ matrix.cross }}-gcc STATIC=1
          VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test static binary under QEMU
        run: >-
          QEMU_LD_PREFIX=/usr/${{ matrix.cross }}
          ${{ matrix.qemu }} ./bin/vlsx -v

      - name: Stage static binary
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx-static

      - name: Build dynamic binary
        run: >-
          make clean && make CC=${{ matrix.cross }}-gcc
          VERSION="${GITHUB_REF_NAME#v}"

      - name: Stage dynamic binary
        run: cp bin/vlsx artifact/vlsx-dynamic

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vlsx-linux-${{ matrix.name }}
          path: artifact/
          if-no-files-found: error

  build-linux-luckfox:
    name: Build (linux-luckfox)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Fetch Luckfox toolchain
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/LuckfoxTECH/luckfox-pico.git "$RUNNER_TEMP/luckfox-sdk"
          git -C "$RUNNER_TEMP/luckfox-sdk" sparse-checkout set \
            tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf
          test -x \
            "$RUNNER_TEMP/luckfox-sdk/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/bin/arm-rockchip830-linux-uclibcgnueabihf-gcc"

      - name: Build release binary
        run: |
          TOOLCHAIN="$RUNNER_TEMP/luckfox-sdk/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/bin"
          make CC="$TOOLCHAIN/arm-rockchip830-linux-uclibcgnueabihf-gcc" \
            VERSION="${GITHUB_REF_NAME#v}"
          file bin/vlsx

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vlsx-linux-luckfox
          path: artifact/
          if-no-files-found: error

  build-android-termux:
    name: Build (android-termux-${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            os: ubuntu-24.04-arm
            image: termux/termux-docker:aarch64
            platform: linux/arm64
          - name: arm7a
            os: ubuntu-latest
            image: termux/termux-docker:arm
            platform: linux/arm/v7
          - name: x86_64
            os: ubuntu-latest
            image: termux/termux-docker:x86_64
            platform: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup QEMU
        if: matrix.name == 'arm7a'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build, smoke test, and package in Termux
        env:
          PKG_NAME: vlsx
          BIN_PATH: bin/vlsx
          VERSION_FLAG: -v
          HOMEPAGE: https://github.com/b1sted/vlsx
          DESCRIPTION: A lightweight terminal toolkit in C for network engineers to calculate VLSM, multicast MACs, SLA metrics, and DHCP timers.
          MAINTAINER: Nikita Mandrykin <pkg@basted.dev>
        run: |
          chmod -R a+rwX .
          docker run --rm \
            --platform ${{ matrix.platform }} \
            --security-opt seccomp:unconfined \
            -e PKG_NAME -e BIN_PATH -e VERSION_FLAG -e HOMEPAGE \
            -e DESCRIPTION -e MAINTAINER \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            /entrypoint.sh bash /workspace/scripts/termux-build.sh "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vlsx-android-termux-${{ matrix.name }}
          path: artifact/
          if-no-files-found: error

  build-macos-intel:
    name: Build (macos-intel)
    needs: test
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download macOS 10.11 SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/SDKs"
          curl -fsSL https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.11.sdk.tar.xz \
            | tar -xJ -C "$GITHUB_WORKSPACE/SDKs"

      - name: Build legacy binary
        run: |
          SDKROOT="$GITHUB_WORKSPACE/SDKs/MacOSX10.11.sdk"
          make \
            CFLAGS="-target x86_64-apple-macos10.7 -isysroot $SDKROOT" \
            LDFLAGS="-target x86_64-apple-macos10.7 -isysroot $SDKROOT -Wl,-ld_classic -Wl,-no_new_main" \
            TARGET=bin/vlsx-legacy \
            VERSION="${GITHUB_REF_NAME#v}"
          ./bin/vlsx-legacy -v

      - name: Build modern binary
        run: |
          SDKROOT="$GITHUB_WORKSPACE/SDKs/MacOSX10.11.sdk"
          rm -rf obj
          make \
            CFLAGS="-target x86_64-apple-macos10.9 -isysroot $SDKROOT" \
            LDFLAGS="-target x86_64-apple-macos10.9 -isysroot $SDKROOT" \
            VERSION="${GITHUB_REF_NAME#v}"
          ./bin/vlsx -v

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx
          cp bin/vlsx-legacy artifact/vlsx-legacy

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vlsx-macos-intel
          path: artifact/
          if-no-files-found: error

  build-macos-arm64:
    name: Build (macos-arm64)
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build release binary
        run: |
          make \
            CFLAGS="-target arm64-apple-macos11" \
            LDFLAGS="-target arm64-apple-macos11" \
            VERSION="${GITHUB_REF_NAME#v}"
          ./bin/vlsx -v

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vlsx-macos-arm64
          path: artifact/
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - test
      - build-linux-amd64
      - build-linux-cross
      - build-linux-luckfox
      - build-android-termux
      - build-macos-intel
      - build-macos-arm64
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_sha256: ${{ steps.source.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Set release version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute source archive checksum
        id: source
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL --retry 5 --retry-delay 2 \
            -o /tmp/vlsx-source.tar.gz \
            "https://github.com/b1sted/vlsx/archive/refs/tags/v${VERSION}.tar.gz"
          echo "sha256=$(sha256sum /tmp/vlsx-source.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p release_dist staging

          pack() {
            local src="$1"
            local name="$2"
            local dir="staging/$name"
            mkdir -p "$dir"
            cp "$src" "$dir/vlsx"
            chmod 0755 "$dir/vlsx"
            tar -C "$dir" -czf "release_dist/vlsx-$name.tar.gz" vlsx
          }

          pack artifacts/vlsx-linux-amd64/vlsx-static linux-amd64
          pack artifacts/vlsx-linux-arm64/vlsx-static linux-arm64
          pack artifacts/vlsx-linux-armv7/vlsx-static linux-armv7
          pack artifacts/vlsx-linux-riscv64/vlsx-static linux-riscv64
          pack artifacts/vlsx-linux-luckfox/vlsx linux-luckfox
          pack artifacts/vlsx-macos-arm64/vlsx macos-arm64
          pack artifacts/vlsx-macos-intel/vlsx-legacy macos-intel-legacy
          pack artifacts/vlsx-macos-intel/vlsx macos-intel-modern
          pack artifacts/vlsx-android-termux-aarch64/vlsx android-termux-aarch64
          pack artifacts/vlsx-android-termux-arm7a/vlsx android-termux-arm7a
          pack artifacts/vlsx-android-termux-x86_64/vlsx android-termux-x86_64

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_VERSION="2.49.0"
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          rm -f /tmp/nfpm.tar.gz /tmp/nfpm
          nfpm --version

      - name: Build Linux packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p nfpm_staging
          for pair in linux-amd64:amd64 linux-arm64:arm64 linux-armv7:arm7 linux-riscv64:riscv64; do
            name="${pair%%:*}"
            arch="${pair##*:}"
            cp "artifacts/vlsx-$name/vlsx-dynamic" nfpm_staging/vlsx
            chmod 0755 nfpm_staging/vlsx
            for packager in deb rpm archlinux; do
              NFPM_ARCH="$arch" VERSION="$VERSION" \
                nfpm package -f nfpm.yaml -p "$packager" -t release_dist/
            done
          done

      - name: Add Termux packages
        run: cp artifacts/vlsx-android-termux-*/*.deb release_dist/

      - name: Generate checksums
        run: |
          (cd release_dist && sha256sum * > /tmp/SHA256SUMS.txt) && mv /tmp/SHA256SUMS.txt release_dist/SHA256SUMS.txt

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: "0DDA70A6A02167984707F0F7A8DE7BE6803A4BE2"

      - name: Sign checksums
        run: |
          gpg --batch --yes --armor --detach-sign --local-user '0DDA70A6A02167984707F0F7A8DE7BE6803A4BE2!' --output release_dist/SHA256SUMS.txt.asc release_dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release_dist/*'

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release_dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: read

    steps:
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: "0DDA70A6A02167984707F0F7A8DE7BE6803A4BE2"
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true

      - name: Update formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SOURCE_SHA256: ${{ needs.release.outputs.source_sha256 }}
        run: |
          set -euo pipefail

          UID_LINE="$(gpg --list-secret-keys --with-colons | awk -F: '/^uid:/ {print $10; exit}')"
          GPG_NAME="${UID_LINE%% <*}"
          GPG_EMAIL="$(printf '%s\n' "$UID_LINE" | sed -n 's/.*<\([^>]*\)>.*/\1/p')"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/b1sted/homebrew-tap.git" tap
          cd tap
          git config user.name "$GPG_NAME"
          git config user.email "$GPG_EMAIL"
          git config commit.gpgsign true

          mkdir -p Formula
          cat > Formula/vlsx.rb <<EOF
          class Vlsx < Formula
            desc "Lightweight terminal toolkit in C for network engineers"
            homepage "https://github.com/b1sted/vlsx"
            url "https://github.com/b1sted/vlsx/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SOURCE_SHA256}"
            license "GPL-3.0-or-later"

            def install
              system "make", "VERSION=#{version}"
              bin.install "bin/vlsx"
            end

            test do
              require "io/console"
              require "pty"
              require "timeout"

              vlsx = bin/"vlsx"
              assert_match "vlsx v#{version}", shell_output("#{vlsx} -v")

              run_tui = lambda do |keys|
                output = +""
                reader, writer, pid = PTY.spawn({ "TERM" => "xterm-256color" }, vlsx.to_s)

                begin
                  reader.winsize = [40, 120]

                  Timeout.timeout(10) do
                    loop do
                      output << reader.readpartial(4096)
                      break if output.include?("IP & VLSM")
                    end
                  end

                  writer.write(keys)
                  writer.flush

                  Timeout.timeout(10) do
                    loop { output << reader.readpartial(4096) }
                  end
                rescue EOFError, Errno::EIO
                  nil
                rescue Timeout::Error
                  Process.kill("KILL", pid)
                  raise
                ensure
                  begin
                    writer.close
                  rescue IOError, Errno::EIO
                    nil
                  end
                  begin
                    reader.close
                  rescue IOError, Errno::EIO
                    nil
                  end
                  begin
                    Process.wait(pid)
                  rescue Errno::ECHILD
                    nil
                  end
                end

                output
              end

              ipv4_output = run_tui.call("\r\r192.168.0.54/26\rq")
              assert_match "255.255.255.192", ipv4_output
              assert_match "192.168.0.62", ipv4_output

              multicast_output = run_tui.call("\e[B\r2\r239.1.1.15\rq")
              assert_match "01:00:5E:01:01:0F", multicast_output
            end
          end
          EOF

          git add Formula/vlsx.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date"
            exit 0
          fi

          git commit -S -m "vlsx ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main

  signal-packages:
    name: Notify packages.basted.dev
    needs: release
    runs-on: ubuntu-latest
    environment: packages
    permissions:
      contents: read

    steps:
      - name: Dispatch a packages rebuild
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PACKAGES_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/b1sted/packages.basted.dev/dispatches \
            -d '{"event_type":"new-release"}'
