name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test, leak & lint
    uses: ./.github/workflows/test.yml

  build-linux-amd64:
    name: Build (linux-amd64)
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build release binary
        run: make VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test
        run: ./bin/vlsx -v

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlsx-linux-amd64
          path: artifact/
          if-no-files-found: error

  build-linux-arm64:
    name: Build (linux-arm64)
    needs: test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build release binary
        run: make VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test
        run: ./bin/vlsx -v

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlsx-linux-arm64
          path: artifact/
          if-no-files-found: error

  build-linux-armv7:
    name: Build (linux-armv7)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf qemu-user

      - name: Build release binary
        run: >-
          make CC=arm-linux-gnueabihf-gcc
          VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test under QEMU
        run: >-
          QEMU_LD_PREFIX=/usr/arm-linux-gnueabihf
          qemu-arm ./bin/vlsx -v

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlsx-linux-armv7
          path: artifact/
          if-no-files-found: error

  build-linux-riscv64:
    name: Build (linux-riscv64)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu qemu-user

      - name: Build release binary
        run: >-
          make CC=riscv64-linux-gnu-gcc
          VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test under QEMU
        run: >-
          QEMU_LD_PREFIX=/usr/riscv64-linux-gnu
          qemu-riscv64 ./bin/vlsx -v

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlsx-linux-riscv64
          path: artifact/
          if-no-files-found: error

  build-linux-luckfox:
    name: Build (linux-luckfox)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Fetch Luckfox toolchain
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/LuckfoxTECH/luckfox-pico.git "$RUNNER_TEMP/luckfox-sdk"
          git -C "$RUNNER_TEMP/luckfox-sdk" sparse-checkout set \
            tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf
          test -x \
            "$RUNNER_TEMP/luckfox-sdk/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/bin/arm-rockchip830-linux-uclibcgnueabihf-gcc"

      - name: Build release binary
        run: |
          TOOLCHAIN="$RUNNER_TEMP/luckfox-sdk/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/bin"
          make CC="$TOOLCHAIN/arm-rockchip830-linux-uclibcgnueabihf-gcc" \
            VERSION="${GITHUB_REF_NAME#v}"
          file bin/vlsx

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlsx-linux-luckfox
          path: artifact/
          if-no-files-found: error

  build-android-termux:
    name: Build (android-termux-${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            os: ubuntu-24.04-arm
            image: termux/termux-docker:aarch64
            platform: linux/arm64
          - name: arm7a
            os: ubuntu-latest
            image: termux/termux-docker:arm
            platform: linux/arm/v7
          - name: x86_64
            os: ubuntu-latest
            image: termux/termux-docker:x86_64
            platform: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup QEMU
        if: matrix.name == 'arm7a'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build, smoke test, and package in Termux
        run: |
          chmod -R a+rwX .
          docker run --rm \
            --platform ${{ matrix.platform }} \
            --security-opt seccomp:unconfined \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            /entrypoint.sh bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y clang make
              VERSION="${1#v}"
              make CC=clang VERSION="$VERSION"
              ./bin/vlsx -v
              ARCH="$(dpkg --print-architecture)"
              PKG="vlsx_${VERSION}_${ARCH}.deb"
              PKGROOT="pkgroot"
              mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/data/data/com.termux/files/usr/bin"
              cp bin/vlsx "$PKGROOT/data/data/com.termux/files/usr/bin/vlsx"
              chmod 0755 "$PKGROOT/data/data/com.termux/files/usr/bin/vlsx"
              printf "%s\n" \
                "Package: vlsx" \
                "Version: $VERSION" \
                "Architecture: $ARCH" \
                "Maintainer: Nikita Mandrykin <pkg@basted.dev>" \
                "Homepage: https://github.com/b1sted/vlsx" \
                "Section: utils" \
                "Priority: optional" \
                "Description: A lightweight terminal toolkit in C for network engineers to calculate VLSM, multicast MACs, SLA metrics, and DHCP timers." \
                > "$PKGROOT/DEBIAN/control"
              dpkg-deb --root-owner-group --build "$PKGROOT" "$PKG"
              dpkg -i "$PKG"
              vlsx -v
              mkdir -p artifact
              cp "$PKG" artifact/
              cp bin/vlsx artifact/vlsx
              chmod -R a+rwX artifact
            ' _ "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlsx-android-termux-${{ matrix.name }}
          path: artifact/
          if-no-files-found: error

  build-macos-intel:
    name: Build (macos-intel)
    needs: test
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download macOS 10.11 SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/SDKs"
          curl -fsSL https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.11.sdk.tar.xz \
            | tar -xJ -C "$GITHUB_WORKSPACE/SDKs"

      - name: Build legacy binary
        run: |
          SDKROOT="$GITHUB_WORKSPACE/SDKs/MacOSX10.11.sdk"
          make \
            CFLAGS="-target x86_64-apple-macos10.7 -isysroot $SDKROOT" \
            LDFLAGS="-target x86_64-apple-macos10.7 -isysroot $SDKROOT -Wl,-ld_classic -Wl,-no_new_main" \
            TARGET=bin/vlsx-legacy \
            VERSION="${GITHUB_REF_NAME#v}"
          ./bin/vlsx-legacy -v

      - name: Build modern binary
        run: |
          SDKROOT="$GITHUB_WORKSPACE/SDKs/MacOSX10.11.sdk"
          rm -rf obj
          make \
            CFLAGS="-target x86_64-apple-macos10.9 -isysroot $SDKROOT" \
            LDFLAGS="-target x86_64-apple-macos10.9 -isysroot $SDKROOT" \
            VERSION="${GITHUB_REF_NAME#v}"
          ./bin/vlsx -v

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx
          cp bin/vlsx-legacy artifact/vlsx-legacy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlsx-macos-intel
          path: artifact/
          if-no-files-found: error

  build-macos-arm64:
    name: Build (macos-arm64)
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build release binary
        run: |
          make \
            CFLAGS="-target arm64-apple-macos11" \
            LDFLAGS="-target arm64-apple-macos11" \
            VERSION="${GITHUB_REF_NAME#v}"
          ./bin/vlsx -v

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/vlsx artifact/vlsx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlsx-macos-arm64
          path: artifact/
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - test
      - build-linux-amd64
      - build-linux-arm64
      - build-linux-armv7
      - build-linux-riscv64
      - build-linux-luckfox
      - build-android-termux
      - build-macos-intel
      - build-macos-arm64
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.meta.outputs.version }}
      macos_arm64_sha256: ${{ steps.hashes.outputs.macos_arm64 }}
      macos_intel_modern_sha256: ${{ steps.hashes.outputs.macos_intel_modern }}
      linux_amd64_sha256: ${{ steps.hashes.outputs.linux_amd64 }}
      linux_arm64_sha256: ${{ steps.hashes.outputs.linux_arm64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set release version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p release_dist staging

          pack() {
            local src="$1"
            local name="$2"
            local dir="staging/$name"
            mkdir -p "$dir"
            cp "$src" "$dir/vlsx"
            chmod 0755 "$dir/vlsx"
            tar -C "$dir" -czf "release_dist/vlsx-$name.tar.gz" vlsx
          }

          pack artifacts/vlsx-linux-amd64/vlsx linux-amd64
          pack artifacts/vlsx-linux-arm64/vlsx linux-arm64
          pack artifacts/vlsx-linux-armv7/vlsx linux-armv7
          pack artifacts/vlsx-linux-riscv64/vlsx linux-riscv64
          pack artifacts/vlsx-linux-luckfox/vlsx linux-luckfox
          pack artifacts/vlsx-macos-arm64/vlsx macos-arm64
          pack artifacts/vlsx-macos-intel/vlsx-legacy macos-intel-legacy
          pack artifacts/vlsx-macos-intel/vlsx macos-intel-modern
          pack artifacts/vlsx-android-termux-aarch64/vlsx android-termux-aarch64
          pack artifacts/vlsx-android-termux-arm7a/vlsx android-termux-arm7a
          pack artifacts/vlsx-android-termux-x86_64/vlsx android-termux-x86_64

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_VERSION="2.49.0"
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          rm -f /tmp/nfpm.tar.gz /tmp/nfpm
          nfpm --version

      - name: Build Linux packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p nfpm_staging
          for pair in linux-amd64:amd64 linux-arm64:arm64 linux-armv7:arm7 linux-riscv64:riscv64; do
            name="${pair%%:*}"
            arch="${pair##*:}"
            cp "artifacts/vlsx-$name/vlsx" nfpm_staging/vlsx
            chmod 0755 nfpm_staging/vlsx
            for packager in deb rpm archlinux; do
              NFPM_ARCH="$arch" VERSION="$VERSION" \
                nfpm package -f nfpm.yaml -p "$packager" -t release_dist/
            done
          done

      - name: Add Termux packages
        run: cp artifacts/vlsx-android-termux-*/*.deb release_dist/

      - name: Generate checksums
        run: |
          (cd release_dist && sha256sum * > /tmp/SHA256SUMS.txt) && mv /tmp/SHA256SUMS.txt release_dist/SHA256SUMS.txt

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign checksums
        run: |
          gpg --batch --yes --armor --detach-sign --output release_dist/SHA256SUMS.txt.asc release_dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release_dist/*'

      - name: Collect archive checksums
        id: hashes
        run: |
          echo "macos_arm64=$(sha256sum release_dist/vlsx-macos-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_intel_modern=$(sha256sum release_dist/vlsx-macos-intel-modern.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(sha256sum release_dist/vlsx-linux-amd64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum release_dist/vlsx-linux-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: read

    steps:
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true

      - name: Update formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          MACOS_ARM64_SHA256: ${{ needs.release.outputs.macos_arm64_sha256 }}
          MACOS_INTEL_MODERN_SHA256: ${{ needs.release.outputs.macos_intel_modern_sha256 }}
          LINUX_AMD64_SHA256: ${{ needs.release.outputs.linux_amd64_sha256 }}
          LINUX_ARM64_SHA256: ${{ needs.release.outputs.linux_arm64_sha256 }}
        run: |
          set -euo pipefail

          UID_LINE="$(gpg --list-secret-keys --with-colons | awk -F: '/^uid:/ {print $10; exit}')"
          GPG_NAME="${UID_LINE%% <*}"
          GPG_EMAIL="$(printf '%s\n' "$UID_LINE" | sed -n 's/.*<\([^>]*\)>.*/\1/p')"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/b1sted/homebrew-tap.git" tap
          cd tap
          git config user.name "$GPG_NAME"
          git config user.email "$GPG_EMAIL"
          git config commit.gpgsign true

          mkdir -p Formula
          cat > Formula/vlsx.rb <<EOF
          class Vlsx < Formula
            desc "A lightweight terminal toolkit in C for network engineers"
            homepage "https://github.com/b1sted/vlsx"
            version "${VERSION}"
            license "GPL-3.0-or-later"

            on_macos do
              on_arm do
                url "https://github.com/b1sted/vlsx/releases/download/v${VERSION}/vlsx-macos-arm64.tar.gz"
                sha256 "${MACOS_ARM64_SHA256}"
              end

              on_intel do
                url "https://github.com/b1sted/vlsx/releases/download/v${VERSION}/vlsx-macos-intel-modern.tar.gz"
                sha256 "${MACOS_INTEL_MODERN_SHA256}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/b1sted/vlsx/releases/download/v${VERSION}/vlsx-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA256}"
              end

              on_intel do
                url "https://github.com/b1sted/vlsx/releases/download/v${VERSION}/vlsx-linux-amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA256}"
              end
            end

            def install
              bin.install "vlsx"
            end

            test do
              system "#{bin}/vlsx", "-v"
            end
          end
          EOF

          git add Formula/vlsx.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date"
            exit 0
          fi

          git commit -S -m "vlsx ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
